# 목록을 새로 만들어 GitHub Pages 에 올린다.
# 서버를 띄우지 않고 깃허브가 정해진 시각에 대신 돌려 주는 방식이라
# 죽을 일이 없고 비용도 들지 않는다.

name: 채용공고 갱신

on:
  schedule:
    # UTC 기준. 한국시간 매일 06시 한 번.
    - cron: "0 21 * * *"
  workflow_dispatch:        # 수동 실행 버튼
  push:
    branches: [main]
    paths: ["scan.py", "salary.py", "certs.py", "compete.py", "detail.py",
            "kosha_panel.py", "kosha_calc.json",
            "kepco_panel.py", "kepco_calc.json",
            "kogas_panel.py", "kogas_calc.json",
            "config.sample.json", ".github/workflows/build.yml"]

permissions:
  contents: write           # compete.json 을 저장소에 누적 커밋한다
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # seen.json 은 NEW 배지 판정용, salary.json 은 보수 캐시(30일).
      # 러너는 매번 새 컨테이너라 캐시로 이어 붙여 준다.
      #
      # compete.json 은 일부러 여기 넣지 않는다. 저장소에 커밋해 쌓는 값이라
      # 캐시에 두면 오래된 캐시가 커밋된 최신본을 덮어써 표본이 되레 줄어든다.
      - uses: actions/cache@v4
        with:
          path: |
            seen.json
            salary.json
            detail.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: 목록 생성
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          GONGGI_SERVER: "1"
        run: |
          # 러너에서 한국 쪽(apis.data.go.kr / opendata.alio.go.kr)으로 가는 길이
          # 간헐적으로 막혀 통째로 timed out 이 난다. 코드 안의 재시도로는
          # 못 넘기는 몇 분짜리 먹통이라, 아예 텀을 두고 다시 돌린다.
          ok=0
          for i in 1 2 3; do
            if python scan.py; then ok=1; break; fi
            echo "::warning::목록 생성 실패 ($i/3)"
            if [ $i -lt 3 ]; then sleep 90; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::세 번 다 실패했습니다 — 한국 쪽 API 에 못 닿는 상태입니다"
            exit 1
          fi
          mkdir -p _site
          cp "채용공고.html" _site/index.html

      # 경쟁률 표본은 하루 API 400회씩 몇 주에 걸쳐 쌓인다.
      # 러너 디스크는 매번 날아가므로 저장소에 되돌려 놔야 이어서 모을 수 있다.
      - name: 경쟁률 표본 커밋
        run: |
          if git diff --quiet -- compete.json; then
            echo "표본 변화 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compete.json
          git commit -m "경쟁률 표본 갱신 [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
